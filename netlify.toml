[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'self'; form-action 'self' https://wa.me; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/movement/produto/:id"
  to = "/produto.html?id=:id"
  status = 301

[[redirects]]
  from = "/pedido/"
  to = "/pedido.html"
  status = 301

[[redirects]]
  from = "/sobre/"
  to = "/sobre.html"
  status = 301

[[redirects]]
  from = "/privacidade/"
  to = "/privacidade.html"
  status = 301

[[redirects]]
  from = "/produto/:id/"
  to = "/produto.html?id=:id"
  status = 301

[[redirects]]
  from = "/produto/:id.html"
  to = "/produto.html?id=:id"
  status = 301

[[redirects]]
  from = "/produto/:id"
  to = "/produto.html?id=:id"
  status = 301
